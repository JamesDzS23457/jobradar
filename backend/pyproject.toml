[project]
name = "jobradar-backend"
version = "0.1.0"
description = "JobRadar API: matching, CV tailoring and job alerts."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "httpx>=0.28.0",
  "apscheduler>=3.11.0",
  "jinja2>=3.1.5",
  "openai>=1.59.0",
  "python-dotenv>=1.0.1",
  "reportlab>=4.2.5",
  "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
